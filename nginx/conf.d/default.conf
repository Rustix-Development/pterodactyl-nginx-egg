server {
    # The panel rewrites this line with the server's port on every start.
    listen 80;
    server_name _;

    #access_log /home/container/naccess.log;
    #error_log  /home/container/nerror.log error;

    # Written by start.sh on every start: webroot, or the Root Folder variable's folder in it
    # (the other folders in webroot are still served at /<folder>/)
    include /home/container/tmp/nginx-root.conf;
    index index.html index.htm index.php;
    charset utf-8;

    # Upload size; keep in line with upload_max_filesize/post_max_size in php-fpm/php.ini
    client_max_body_size 100m;
    client_body_timeout 120s;
    sendfile off;

    # Also written by start.sh: what missing pages get, index.php or the 404 Page variable's page
    include /home/container/tmp/nginx-errors.conf;

    location / {
        try_files $uri $uri/ @missing;
    }

    # Falls back to PHP so WordPress etc. can generate them
    location = /favicon.ico { try_files $uri /index.php?$query_string; access_log off; log_not_found off; }
    location = /robots.txt  { try_files $uri /index.php?$query_string; access_log off; log_not_found off; }

    # Block dotfiles (.env, .git, .htaccess, ...) but keep .well-known for SSL/ACME checks
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Composer files (auth.json can hold tokens)
    location ~ ^/(composer\.(json|lock)|auth\.json)$ {
        deny all;
    }

    # Composer packages: never serve its metadata or run package PHP files over HTTP.
    # Other files under /vendor/ (e.g. a static site's vendor/jquery) are still served.
    location ~ ^/vendor/(composer/|bin/|autoload\.php) {
        deny all;
    }
    location ~ ^/vendor/.*\.php(/|$) {
        deny all;
    }

    # PHP, including /script.php/extra/path (PATH_INFO)
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        # Only run PHP files that exist
        if (!-f $document_root$fastcgi_script_name) {
            return 404;
        }
        fastcgi_pass unix:/home/container/tmp/php-fpm.sock;
        fastcgi_index index.php;
        include /home/container/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }
}
