[www]
listen = /home/container/tmp/php-fpm.sock

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Pass the server's environment (the egg's SITE_*, GA_*, SMTP_*, MAIL_*, TURNSTILE_*,
; DISCORD_*, GOOGLE_*, DB_CONNECTION_STRING variables) through to PHP so getenv() works.
; PHP-FPM wipes the environment by default.
clear_env = no

; Only run .php files (the default also allows .phar)
security.limit_extensions = .php

; Send PHP errors from workers to logs/php-fpm.log
catch_workers_output = yes
decorate_workers_output = no
